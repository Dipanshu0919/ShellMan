<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>(function(){try{var t=localStorage.getItem('shellman_theme')||'dark';if(t==='system')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';if(t!=='light')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShellMan</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b111c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShellMan">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_v('css/style.css') }}">
  <link rel="stylesheet" href="{{ static_v('css/light.css') }}">
  <script src="{{ static_v('js/theme.js') }}"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, var(--bg-surface-elevated) 0%, var(--bg-system) 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ShellMan Logo" style="width: 72px; height: 72px; filter: drop-shadow(0 8px 24px color-mix(in srgb, var(--sm-accent) 40%, transparent)); margin-bottom: 0.35rem;">
      <h1 class="brand-title" style="font-size: 1.7rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-primary); margin: 0;">ShellMan</h1>
      <p style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin: 0;">Remote Infrastructure Workspace</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter your username" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.7rem;">
          Sign In
        </button>
      </div>
    </form>
  </div>
</body>
</html>
