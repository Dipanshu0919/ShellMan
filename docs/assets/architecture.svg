<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="ShellMan runs on your machine and talks to servers over SSH on port 22">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0d2038"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
  </defs>
  <g font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
    <rect width="1100" height="300" rx="20" fill="url(#a)" stroke="#1e3a5f"/>
    <!-- your machine -->
    <g transform="translate(40 52)">
      <rect width="300" height="196" rx="16" fill="#0e1b33" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/>
      <text x="24" y="38" font-size="13" font-weight="700" letter-spacing="1.4" fill="#38bdf8">YOUR MACHINE</text>
      <rect x="24" y="56" width="252" height="74" rx="10" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="40" y="84" font-size="20" font-weight="700" fill="#f1f5f9">ShellMan</text>
      <text x="40" y="108" font-size="13.5" fill="#94a3b8">web desktop, terminal, files, editor</text>
      <text x="24" y="162" font-size="14" fill="#cbd5e1">Laptop, desktop or private gateway</text>
      <text x="24" y="182" font-size="12.5" fill="#64748b">Flask + SQLite, built for low memory</text>
    </g>

    <!-- link -->
    <line x1="350" y1="150" x2="750" y2="150" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <g transform="translate(450 112)">
      <rect width="200" height="76" rx="14" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".5"/>
      <text x="100" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#f1f5f9">OpenSSH :22</text>
      <text x="100" y="56" text-anchor="middle" font-size="14" fill="#94a3b8">+ SFTP, nothing else</text>
    </g>

    <!-- servers -->
    <g transform="translate(760 52)">
      <rect width="300" height="196" rx="16" fill="#0e1b33" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/>
      <text x="24" y="38" font-size="13" font-weight="700" letter-spacing="1.4" fill="#34d399">YOUR SERVERS</text>
      <g font-size="14" fill="#e2e8f0">
        <rect x="24" y="56" width="252" height="32" rx="8" fill="#0b1220" stroke="#1e3a5f"/><circle cx="42" cy="72" r="5" fill="#34d399"/><text x="58" y="77">production VPS</text>
        <rect x="24" y="96" width="252" height="32" rx="8" fill="#0b1220" stroke="#1e3a5f"/><circle cx="42" cy="112" r="5" fill="#34d399"/><text x="58" y="117">staging box</text>
        <rect x="24" y="136" width="252" height="32" rx="8" fill="#0b1220" stroke="#1e3a5f"/><circle cx="42" cy="152" r="5" fill="#34d399"/><text x="58" y="157">Raspberry Pi / home lab</text>
      </g>
      <text x="24" y="188" font-size="12.5" fill="#64748b">0 MB agent, no daemon, no extra port</text>
    </g>
  </g>
</svg>
