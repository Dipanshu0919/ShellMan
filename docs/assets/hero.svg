<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="ShellMan: agentless Linux server manager in your browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b16"/><stop offset=".55" stop-color="#0b1a33"/><stop offset="1" stop-color="#0a2540"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <radialGradient id="glowA" cx=".2" cy=".15" r=".6"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".30"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".95" cy=".95" r=".55"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7dd3fc" fill-opacity=".10"/></pattern>
    <clipPath id="clip"><rect width="1280" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#dots)"/>
    <rect width="1280" height="380" fill="url(#glowA)"/>
    <rect width="1280" height="380" fill="url(#glowB)"/>

    <!-- mark -->
    <g transform="translate(70 78)">
      <rect width="84" height="84" rx="22" fill="#0b1220" stroke="url(#mark)" stroke-width="2.5"/>
      <path d="M57 28c-3-4-8-6-14-6-9 0-15 4-15 11 0 15 28 8 28 22 0 7-6 11-15 11-6 0-12-2-16-7" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="178" y="134" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#title)">ShellMan</text>
    <text x="72" y="206" font-size="25" font-weight="600" fill="#e2e8f0">Run a full Linux server desktop in your browser.</text>
    <text x="72" y="240" font-size="19" fill="#94a3b8">Agentless. SSH and SFTP only. 0 MB installed on the servers you manage.</text>

    <!-- chips -->
    <g font-size="15" font-weight="600" fill="#bae6fd">
      <g transform="translate(72 276)"><rect width="74" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="37" y="22" text-anchor="middle">SSH</text></g>
      <g transform="translate(156 276)"><rect width="78" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="39" y="22" text-anchor="middle">SFTP</text></g>
      <g transform="translate(244 276)"><rect width="92" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="46" y="22" text-anchor="middle">Docker</text></g>
      <g transform="translate(346 276)"><rect width="86" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="43" y="22" text-anchor="middle">Nginx</text></g>
      <g transform="translate(442 276)"><rect width="92" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="46" y="22" text-anchor="middle">Apache</text></g>
      <g transform="translate(544 276)"><rect width="118" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="59" y="22" text-anchor="middle">Databases</text></g>
      <g transform="translate(672 276)"><rect width="104" height="34" rx="17" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/><text x="52" y="22" text-anchor="middle">Light + Dark</text></g>
    </g>

    <!-- desktop mock -->
    <g transform="translate(820 52)">
      <rect width="400" height="276" rx="16" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
      <rect width="400" height="34" rx="16" fill="#101a2e"/>
      <rect y="18" width="400" height="16" fill="#101a2e"/>
      <circle cx="22" cy="17" r="5" fill="#f87171"/><circle cx="40" cy="17" r="5" fill="#fbbf24"/><circle cx="58" cy="17" r="5" fill="#34d399"/>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace,Menlo,Consolas,monospace">azureuser@web-prod-1</text>
      <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5">
        <text x="20" y="66" fill="#34d399">$</text><text x="36" y="66" fill="#e2e8f0">systemctl status nginx</text>
        <text x="20" y="90" fill="#4ade80">active (running) since Mon 2026</text>
        <text x="20" y="122" fill="#34d399">$</text><text x="36" y="122" fill="#e2e8f0">docker ps --format "{{.Names}}"</text>
        <text x="20" y="146" fill="#94a3b8">api  worker  redis  postgres</text>
        <text x="20" y="178" fill="#34d399">$</text><text x="36" y="178" fill="#e2e8f0">rsync -az ./app/ web-prod-1:/srv/</text>
        <text x="20" y="202" fill="#94a3b8">sent 12.4 MB  1.8k files  0 errors</text>
        <text x="20" y="234" fill="#34d399">$</text><rect x="36" y="222" width="9" height="16" fill="#38bdf8" fill-opacity=".85"/>
      </g>
      <g transform="translate(300 40)">
        <rect width="86" height="64" rx="10" fill="#0e1b33" stroke="#1e3a5f"/>
        <text x="12" y="22" font-size="10.5" fill="#64748b" letter-spacing="1">CPU</text>
        <text x="12" y="46" font-size="22" font-weight="700" fill="#38bdf8">4.8%</text>
        <rect x="12" y="53" width="62" height="4" rx="2" fill="#1e3a5f"/><rect x="12" y="53" width="12" height="4" rx="2" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
