services:
  shellman:
    build: .
    image: shellman:latest
    container_name: shellman
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SHELLMAN_SECRET_KEY=replace-with-a-secure-secret-key-in-production
      - SHELLMAN_LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - shellman_data:/app/instance
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  shellman_data:
    driver: local

